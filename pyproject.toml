[project]
name = "hklii-psla"
version = "0.1.0"
description = "Structured feature extraction for Hong Kong personal injury judgments"
readme = "README.md"
authors = [
    { name = "ammar-abagumbul", email = "ammar96@connect.hku.hk" }
]
requires-python = ">=3.12"
dependencies = [
    "instructor>=1.15.4",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.4",
    "langchain-google-genai>=4.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "langchain-openrouter>=0.2.7",
    "litellm>=1.0.0",
    "loguru>=0.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "ollama>=0.6.2",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
]

[project.scripts]
psla = "hklii_psla.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
